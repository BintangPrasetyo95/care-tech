<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareTech - Refleksi Diri (Cardboard Cosmos)</title>
    <link rel="icon" href="assets/logo-care-tech.png">
    <link rel="stylesheet" href="reflection.css">
</head>
<body>
    <!-- Floating Space & Paper Junk Decorations -->
    <div class="bg-decorations" aria-hidden="true">
        <b class="star" style="top:8%;left:12%"></b>
        <b class="star" style="top:22%;right:15%;color:var(--cy);animation-delay:-0.4s"></b>
        <b class="star" style="top:74%;left:8%;color:var(--pink);animation-delay:-1.1s"></b>
        <b class="star" style="top:85%;right:18%;color:var(--lime);animation-delay:-0.7s"></b>
        <b class="star" style="top:45%;right:6%;color:var(--sun)"></b>
        <i class="deb tp" style="left:5%;top:38%"></i>
        <i class="deb sc" style="right:7%;top:58%;animation-delay:-1.5s"></i>
        <i class="deb cp" style="left:8%;bottom:12%;animation-delay:-0.8s"></i>
        <i class="deb bl" style="right:10%;top:14%;animation-delay:-2.2s"></i>
    </div>

    <div class="reflection-container">
        <!-- Cardboard Clipboard Backing -->
        <div class="clipboard-backing" aria-hidden="true"></div>
        <div class="clipboard-clip" aria-hidden="true"></div>

        <!-- Scrapbook Card -->
        <div class="scrapbook-card mk">
            <span class="stamp-badge">HARIAN! ★</span>
            <p class="tape">CareTech // Refleksi Diri</p>
            <h2>Halo Teman!</h2>
            <p class="intro-text">Sebelum berpetualang, ceritakan kabarmu hari ini ya!</p>
            
            <div class="step-indicator" id="step-badge">
                <span>SOAL 1 DARI 3</span>
            </div>

            <form id="reflection-form">
                <!-- Question 1 -->
                <div class="question-block active" id="q1">
                    <h3>Bagaimana perasaanmu hari ini?</h3>
                    <div class="emoji-options">
                        <label class="emoji-option mk">
                            <input type="radio" name="feeling" value="senang" required>
                            <span class="emoji">😃</span>
                            <span class="label">Senang</span>
                        </label>
                        <label class="emoji-option mk">
                            <input type="radio" name="feeling" value="biasa">
                            <span class="emoji">😐</span>
                            <span class="label">Biasa</span>
                        </label>
                        <label class="emoji-option mk">
                            <input type="radio" name="feeling" value="sedih">
                            <span class="emoji">😔</span>
                            <span class="label">Sedih</span>
                        </label>
                        <label class="emoji-option mk">
                            <input type="radio" name="feeling" value="marah">
                            <span class="emoji">😠</span>
                            <span class="label">Marah</span>
                        </label>
                    </div>
                    <div class="textarea-container">
                        <textarea name="feeling_notes" rows="3" placeholder="Tuliskan ceritamu di sini... (opsional ya!)" class="custom-textarea mk-alt"></textarea>
                    </div>
                </div>

                <!-- Question 2 -->
                <div class="question-block" id="q2">
                    <h3>Seberapa bersemangat kamu untuk belajar?</h3>
                    <div class="emoji-options">
                        <label class="emoji-option mk">
                            <input type="radio" name="energy" value="sangat_semangat" required>
                            <span class="emoji">🚀</span>
                            <span class="label">Super!</span>
                        </label>
                        <label class="emoji-option mk">
                            <input type="radio" name="energy" value="semangat">
                            <span class="emoji">👍</span>
                            <span class="label">Semangat</span>
                        </label>
                        <label class="emoji-option mk">
                            <input type="radio" name="energy" value="kurang">
                            <span class="emoji">🥱</span>
                            <span class="label">Kurang</span>
                        </label>
                    </div>
                </div>

                <!-- Question 3 -->
                <div class="question-block" id="q3">
                    <h3>Apakah kamu sudah sarapan / makan?</h3>
                    <div class="emoji-options">
                        <label class="emoji-option mk">
                            <input type="radio" name="food" value="sudah" required>
                            <span class="emoji">🥪</span>
                            <span class="label">Sudah!</span>
                        </label>
                        <label class="emoji-option mk">
                            <input type="radio" name="food" value="belum">
                            <span class="emoji">🍽️</span>
                            <span class="label">Belum</span>
                        </label>
                    </div>
                </div>

                <!-- Navigation -->
                <div class="navigation-buttons">
                    <button type="button" id="btn-prev" class="btn btn-secondary mk" style="display: none;">◀ Kembali</button>
                    <button type="button" id="btn-next" class="btn btn-primary mk">Lanjut ▶</button>
                    <button type="submit" id="btn-submit" class="btn btn-submit mk" style="display: none;">Selesai &amp; Ke Dashboard 🚀</button>
                </div>
            </form>

            <p class="footer-note">P.S. Jawabanmu aman dan hanya untuk evaluasi kebaikanmu!</p>
        </div>
    </div>

    <script>
        const questions = document.querySelectorAll('.question-block');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');
        const form = document.getElementById('reflection-form');
        const stepBadge = document.getElementById('step-badge');
        
        let currentStep = 0;

        function updateForm() {
            questions.forEach((q, index) => {
                q.classList.remove('active');
                if (index === currentStep) {
                    q.classList.add('active');
                }
            });

            if (stepBadge) {
                stepBadge.innerHTML = `<span>SOAL ${currentStep + 1} DARI ${questions.length}</span>`;
            }

            btnPrev.style.display = currentStep > 0 ? 'inline-block' : 'none';
            
            if (currentStep === questions.length - 1) {
                btnNext.style.display = 'none';
                btnSubmit.style.display = 'inline-block';
            } else {
                btnNext.style.display = 'inline-block';
                btnSubmit.style.display = 'none';
            }
        }

        btnNext.addEventListener('click', () => {
            const currentInputs = questions[currentStep].querySelectorAll('input[type="radio"]');
            const isChecked = Array.from(currentInputs).some(radio => radio.checked);
            
            if (isChecked) {
                if (currentStep < questions.length - 1) {
                    currentStep++;
                    updateForm();
                }
            } else {
                alert("Tolong pilih salah satu stiker ya! 😊");
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateForm();
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const reflectionData = {
                feeling: formData.get('feeling'),
                feeling_notes: formData.get('feeling_notes'),
                energy: formData.get('energy'),
                food: formData.get('food'),
                date: new Date().toISOString()
            };
            
            let allReflections = JSON.parse(localStorage.getItem('caretech_reflections') || '[]');
            allReflections.push(reflectionData);
            localStorage.setItem('caretech_reflections', JSON.stringify(allReflections));

            window.location.href = 'dashboard.html';
        });

        updateForm();
    </script>
</body>
</html>
