<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareTech - Masuk (Cardboard Cosmos)</title>
    <link rel="icon" href="assets/logo-care-tech.png">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        /* ==========================================================================
           LOGIN PAGE - CARDBOARD COSMOS STUDENT BADGE THEME
           ========================================================================== */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem 1rem 3rem;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Top Brand Header Bar */
        .login-topbar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.6rem;
            position: relative;
            z-index: 10;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #ffffff;
            border: 3.5px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            padding: 0.5rem 1.1rem;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            text-decoration: none;
            color: var(--ink);
            transform: rotate(-1.5deg);
            transition: transform 0.15s ease;
        }

        .brand-badge:hover {
            transform: rotate(0deg) scale(1.03);
        }

        .brand-badge img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .brand-badge span {
            font-family: var(--imp);
            font-size: 1.6rem;
            letter-spacing: 0.05em;
        }

        .back-link {
            font-family: var(--mono);
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--ink);
            text-decoration: none;
            background: var(--sun);
            border: 2.5px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            transform: rotate(1deg);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .back-link:hover {
            background: var(--lime);
            transform: scale(1.04) rotate(-1deg);
        }

        /* Main Student Pass Login Card */
        .login-card-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        /* Clipboard backing illusion */
        .clipboard-plate {
            position: absolute;
            inset: -12px -10px -12px -10px;
            background: var(--kraft);
            border: 4.5px solid var(--ink);
            border-radius: 25px;
            box-shadow: 12px 12px 0 var(--ink);
            transform: rotate(0.8deg);
            z-index: 1;
        }

        /* Top Clip */
        .clipboard-clip {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 38px;
            background: #d4d4d8;
            border: 4px solid var(--ink);
            border-radius: 8px 8px 12px 12px;
            box-shadow: 4px 4px 0 var(--ink);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clipboard-clip::after {
            content: '';
            width: 70px;
            height: 10px;
            background: #71717a;
            border: 2px solid var(--ink);
            border-radius: 4px;
        }

        .login-card-body {
            position: relative;
            z-index: 3;
            background: var(--paper-warm);
            border: 4px solid var(--ink);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            padding: 2.8rem 2.2rem 2.2rem;
            box-shadow: 6px 6px 0 var(--ink);
            transform: rotate(-0.6deg);
        }

        .stamp-badge-login {
            position: absolute;
            top: -16px;
            right: 24px;
            background: var(--pink);
            color: #ffffff;
            border: 3.5px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-family: var(--imp);
            font-size: 1.15rem;
            padding: 0.3rem 0.9rem;
            transform: rotate(7deg);
            letter-spacing: 0.05em;
        }

        .login-title {
            font-family: var(--imp);
            font-size: clamp(2rem, 5vw, 2.6rem);
            line-height: 1.1;
            margin: 0.4rem 0 1.5rem 0;
            color: var(--ink);
        }

        /* Form Group Styles */
        .form-group-cosmos {
            margin-bottom: 1.4rem;
            text-align: left;
        }

        .label-cosmos {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: var(--mono);
            font-weight: 800;
            font-size: 0.88rem;
            color: var(--ink);
            margin-bottom: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .input-cosmos {
            width: 100%;
            padding: 0.9rem 1.1rem;
            font-family: var(--mono);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
            background: #ffffff;
            border: 3.5px solid var(--ink);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--ink);
            outline: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .input-cosmos:focus {
            background: #fffde6;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--ink);
            border-color: var(--ink);
        }

        .input-cosmos::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-pwd-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--paper-warm);
            border: 2px solid var(--ink);
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            font-size: 0.82rem;
            cursor: pointer;
            font-family: var(--mono);
            font-weight: bold;
            box-shadow: 2px 2px 0 var(--ink);
            transition: all 0.15s ease;
        }

        .toggle-pwd-btn:hover {
            background: var(--sun);
            transform: translateY(-50%) scale(1.05);
        }

        /* Role Selector Tabs (Cardboard Cosmos) */
        .role-switch-container {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            margin-top: 0.2rem;
        }

        .role-tab-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 0.6rem;
            font-family: var(--imp);
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            color: var(--ink);
            background: #ffffff;
            border: 3.5px solid var(--ink);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .role-tab-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0 var(--ink);
            background: #fffde6;
        }

        .role-tab-btn.active {
            background: var(--lime);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .role-tab-btn.tab-guardian.active {
            background: var(--sun);
        }

        /* Demo Buttons Group */
        .demo-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.85rem;
        }

        .btn-demo-cosmos {
            width: 100%;
            margin-top: 0;
            background: #ffffff;
            color: var(--ink);
            font-family: var(--mono);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            padding: 0.8rem 1.2rem;
            border: 3.5px dashed var(--ink);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
        }

        .btn-demo-cosmos:hover {
            background: var(--sun);
            border-style: solid;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .btn-demo-cosmos:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .btn-demo-guardian {
            background: #fff8eb;
        }

        .btn-demo-guardian:hover {
            background: #ffd1dc !important;
        }

        /* Submit Button */
        .btn-submit-cosmos {
            width: 100%;
            background: var(--lime);
            color: var(--ink);
            font-family: var(--imp);
            font-size: 1.45rem;
            letter-spacing: 0.05em;
            padding: 0.95rem 1.5rem;
            border: 4px solid var(--ink);
            border-radius: 14px;
            box-shadow: 6px 6px 0 var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.15s ease;
        }

        .btn-submit-cosmos:hover {
            background: var(--pink);
            color: #ffffff;
            transform: translate(-2px, -2px);
            box-shadow: 9px 9px 0 var(--ink);
        }

        .btn-submit-cosmos:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        /* Bottom Helper Strip */
        .login-footer-info {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 3.5px dashed var(--ink);
            text-align: center;
            font-family: var(--mono);
            font-size: 0.85rem;
            color: #555;
        }

        .login-footer-info a {
            color: var(--pink);
            font-weight: bold;
            text-decoration: underline wavy var(--pink) 1.5px;
        }

        .bottom-author {
            margin-top: 1.5rem;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Responsive Breakpoints */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.65rem 2rem;
            }

            .login-topbar {
                margin-bottom: 1.2rem;
            }

            .brand-badge {
                padding: 0.35rem 0.75rem;
                gap: 0.4rem;
                transform: none !important;
            }

            .brand-badge img {
                width: 28px;
                height: 28px;
            }

            .brand-badge span {
                font-size: 1.3rem;
            }

            .back-link {
                font-size: 0.78rem;
                padding: 0.35rem 0.75rem;
                transform: none !important;
            }

            .clipboard-plate {
                inset: -6px -5px;
                border-width: 3.5px;
                border-radius: 18px;
                box-shadow: 6px 6px 0 var(--ink);
                transform: none !important;
            }

            .clipboard-clip {
                width: 110px;
                height: 30px;
                top: -18px;
                border-width: 3px;
            }

            .clipboard-clip::after {
                width: 55px;
                height: 8px;
            }

            .login-card-body {
                padding: 2.2rem 1.1rem 1.4rem;
                border-width: 3.5px;
                box-shadow: 5px 5px 0 var(--ink);
                transform: none !important;
            }

            .stamp-badge-login {
                font-size: 0.95rem;
                padding: 0.2rem 0.65rem;
                right: 14px;
                top: -12px;
                border-width: 2.5px;
                box-shadow: 3px 3px 0 var(--ink);
                transform: rotate(4deg);
            }

            .login-title {
                font-size: 1.9rem;
                margin: 0.2rem 0 1.2rem;
            }

            .input-cosmos {
                padding: 0.75rem 0.9rem;
                font-size: 1rem;
                border-width: 3px;
            }

            .btn-submit-cosmos {
                font-size: 1.2rem;
                padding: 0.8rem 1.1rem;
                border-width: 3.5px;
                box-shadow: 4px 4px 0 var(--ink);
            }

            .btn-demo-cosmos {
                font-size: 0.88rem;
                padding: 0.7rem 1rem;
                border-width: 2.5px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 0.8rem 0.45rem 1.5rem;
            }

            .login-card-body {
                padding: 2rem 0.85rem 1.2rem;
                border-width: 3px;
                box-shadow: 4px 4px 0 var(--ink);
            }

            .clipboard-plate {
                inset: -4px -3px;
                box-shadow: 4px 4px 0 var(--ink);
                border-width: 3px;
            }

            .login-title {
                font-size: 1.65rem;
            }

            .btn-submit-cosmos {
                font-size: 1.05rem;
                padding: 0.75rem 0.85rem;
            }

            .label-cosmos {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Space & Paper Junk Background Decorations -->
    <div style="position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;" aria-hidden="true">
        <b class="star" style="top:8%;left:12%"></b>
        <b class="star" style="top:22%;right:15%;color:var(--cy);animation-delay:-0.4s"></b>
        <b class="star" style="top:74%;left:8%;color:var(--pink);animation-delay:-1.1s"></b>
        <b class="star" style="top:85%;right:18%;color:var(--lime);animation-delay:-0.7s"></b>
        <b class="star" style="top:45%;right:6%;color:var(--sun)"></b>
        <i class="deb tp" style="left:5%;top:38%"></i>
        <i class="deb sc" style="right:7%;top:58%;animation-delay:-1.5s"></i>
        <i class="deb cp" style="left:8%;bottom:12%;animation-delay:-0.8s"></i>
        <i class="deb bl" style="right:10%;top:14%;animation-delay:-2.2s"></i>
    </div>

    <!-- Top Navigation Bar -->
    <header class="login-topbar">
        <a href="index.html" class="brand-badge" title="Kembali ke Beranda">
            <img src="assets/logo-care-tech.png" alt="CareTech Logo">
            <span>CareTech</span>
        </a>
        <a href="index.html" class="back-link">
            ← Beranda
        </a>
    </header>

    <!-- Main Login Card (Cardboard Clipboard Pass) -->
    <main class="login-card-container">
        <!-- Clipboard Backing & Metallic Clip -->
        <div class="clipboard-plate" aria-hidden="true"></div>
        <div class="clipboard-clip" aria-hidden="true"></div>

        <!-- Scrapbook Card Form -->
        <div class="login-card-body">
            <span class="stamp-badge-login">MASUK! ★</span>
            
            <!-- Role Selector Tabs -->
            <div class="role-switch-container" role="tablist" aria-label="Pilihan Peran Masuk">
                <button type="button" class="role-tab-btn active" id="tab-student" onclick="setLoginRole('student')" role="tab" aria-selected="true">
                    🎒 <span>Siswa</span>
                </button>
                <button type="button" class="role-tab-btn tab-guardian" id="tab-guardian" onclick="setLoginRole('guardian')" role="tab" aria-selected="false">
                    👨‍👩‍👧 <span>Wali Murid</span>
                </button>
            </div>

            <span class="tape tape-lime" id="role-tape" style="margin-bottom: 0.4rem; font-size: 0.85rem;">KARTU AKSES // SISWA HARMONIA</span>
            
            <h1 class="login-title" id="login-title">Masuk Kelas</h1>

            <form action="reflection.html" method="GET" id="login-form">
                <!-- Identifier Input (NISN / Phone / ID Wali) -->
                <div class="form-group-cosmos">
                    <label for="login-id" class="label-cosmos" id="id-label">
                        🔢 <span>NISN (Nomor Induk Siswa)</span>
                    </label>
                    <input 
                        type="text" 
                        id="login-id" 
                        name="identifier" 
                        class="input-cosmos" 
                        placeholder="Contoh: 00892026" 
                        required 
                        autocomplete="username"
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group-cosmos">
                    <label for="password" class="label-cosmos">
                        🔑 <span>Kata Sandi / Password</span>
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="input-cosmos" 
                            placeholder="Masukkan kata sandi..." 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Lihat Kata Sandi">
                            👁️ Intip
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit-cosmos" id="btn-submit">
                    Masuk ke Refleksi Diri 🚀
                </button>

                <!-- Demo Account Buttons Group -->
                <div class="demo-buttons-group">
                    <button type="button" class="btn-demo-cosmos" id="btn-demo-main" onclick="triggerCurrentDemo()" title="Masuk langsung menggunakan akun demo yang aktif">
                        🎮 Coba Demo Siswa (Zuruki)
                    </button>
                    <button type="button" class="btn-demo-cosmos btn-demo-guardian" id="btn-demo-alt" onclick="switchTabAndLoginDemo()" title="Masuk langsung sebagai Wali Murid">
                        👨‍👩‍👧 Coba Demo Wali Murid (Bpk. Hendra)
                    </button>
                </div>

                <!-- Footer Info -->
                <div class="login-footer-info" id="footer-info">
                    <span>Mengalami kendala login? Hubungi <strong>Guru Wali Kelas</strong> atau <strong>Guru BK</strong>.</span>
                </div>
            </form>
        </div>
    </main>

    <!-- Bottom Footer Tag -->
    <footer class="bottom-author">
        <p class="tape tape-white" style="font-size: 0.85rem; margin-bottom: 0;">By Carelix, 2026</p>
    </footer>

    <script>
        let currentRole = 'student';

        // Toggle password show/hide
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const btn = document.querySelector('.toggle-pwd-btn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                btn.textContent = '🔒 Sembunyikan';
            } else {
                pwdInput.type = 'password';
                btn.textContent = '👁️ Intip';
            }
        }

        // Switch role UI mode
        function setLoginRole(role) {
            currentRole = role;
            const tabStudent = document.getElementById('tab-student');
            const tabGuardian = document.getElementById('tab-guardian');
            const roleTape = document.getElementById('role-tape');
            const stampBadge = document.querySelector('.stamp-badge-login');
            const loginTitle = document.getElementById('login-title');
            const idLabel = document.getElementById('id-label');
            const idInput = document.getElementById('login-id');
            const btnSubmit = document.getElementById('btn-submit');
            const btnDemoMain = document.getElementById('btn-demo-main');
            const btnDemoAlt = document.getElementById('btn-demo-alt');
            const footerInfo = document.getElementById('footer-info');

            if (role === 'guardian') {
                tabStudent.classList.remove('active');
                tabGuardian.classList.add('active');
                tabStudent.setAttribute('aria-selected', 'false');
                tabGuardian.setAttribute('aria-selected', 'true');

                roleTape.className = 'tape tape-pink';
                roleTape.textContent = 'PORTAL WALI // HARMONIA SCHOOL';
                stampBadge.textContent = 'WALI! ★';
                stampBadge.style.background = 'var(--sun)';
                stampBadge.style.color = 'var(--ink)';

                loginTitle.textContent = 'Masuk Portal Wali';
                idLabel.innerHTML = '📱 <span>No. Handphone / ID Wali</span>';
                idInput.placeholder = 'Contoh: 081234567890 atau WALI-00892026';
                btnSubmit.textContent = 'Masuk ke Portal Wali 🏡';
                btnSubmit.style.background = 'var(--sun)';

                btnDemoMain.innerHTML = '👨‍👩‍👧 Coba Demo Wali Murid (Bpk. Hendra)';
                btnDemoMain.className = 'btn-demo-cosmos btn-demo-guardian';
                btnDemoAlt.innerHTML = '🎒 Coba Demo Siswa (Zuruki)';
                btnDemoAlt.className = 'btn-demo-cosmos';

                footerInfo.innerHTML = '<span>Akun wali murid terhubung langsung dengan perkembangan belajar <strong>Zuruki (Kelas V-A)</strong>.</span>';
            } else {
                tabGuardian.classList.remove('active');
                tabStudent.classList.add('active');
                tabStudent.setAttribute('aria-selected', 'true');
                tabGuardian.setAttribute('aria-selected', 'false');

                roleTape.className = 'tape tape-lime';
                roleTape.textContent = 'KARTU AKSES // SISWA HARMONIA';
                stampBadge.textContent = 'MASUK! ★';
                stampBadge.style.background = 'var(--pink)';
                stampBadge.style.color = '#ffffff';

                loginTitle.textContent = 'Masuk Kelas';
                idLabel.innerHTML = '🔢 <span>NISN (Nomor Induk Siswa)</span>';
                idInput.placeholder = 'Contoh: 00892026';
                btnSubmit.textContent = 'Masuk ke Refleksi Diri 🚀';
                btnSubmit.style.background = 'var(--lime)';

                btnDemoMain.innerHTML = '🎮 Coba Demo Siswa (Zuruki)';
                btnDemoMain.className = 'btn-demo-cosmos';
                btnDemoAlt.innerHTML = '👨‍👩‍👧 Coba Demo Wali Murid (Bpk. Hendra)';
                btnDemoAlt.className = 'btn-demo-cosmos btn-demo-guardian';

                footerInfo.innerHTML = '<span>Mengalami kendala login? Hubungi <strong>Guru Wali Kelas</strong> atau <strong>Guru BK</strong>.</span>';
            }
        }

        // Trigger demo login for current selected tab
        function triggerCurrentDemo() {
            if (currentRole === 'guardian') {
                loginDemoGuardian();
            } else {
                loginDemoStudent();
            }
        }

        // Switch to the other tab and immediately log in
        function switchTabAndLoginDemo() {
            if (currentRole === 'guardian') {
                loginDemoStudent();
            } else {
                loginDemoGuardian();
            }
        }

        // Login directly as demo student
        function loginDemoStudent() {
            localStorage.setItem('caretech_user_role', 'student');
            localStorage.setItem('caretech_user_name', 'Zuruki');
            localStorage.setItem('caretech_student_name', 'Zuruki');
            localStorage.setItem('caretech_student_class', 'Kelas V-A // Harmonia');
            const idInput = document.getElementById('login-id');
            const pwdInput = document.getElementById('password');
            if (idInput) idInput.value = '00892026';
            if (pwdInput) pwdInput.value = 'harmonia123';
            window.location.href = 'reflection.html';
        }

        // Login directly as demo guardian
        function loginDemoGuardian() {
            localStorage.setItem('caretech_user_role', 'guardian');
            localStorage.setItem('caretech_user_name', 'Bpk. Hendra Wijaya');
            localStorage.setItem('caretech_student_name', 'Zuruki');
            localStorage.setItem('caretech_student_class', 'Kelas V-A // Harmonia');
            localStorage.setItem('caretech_guardian_relation', 'Ayah Kandung / Wali Murid');
            localStorage.setItem('caretech_guardian_phone', '0812-3456-7890');
            const idInput = document.getElementById('login-id');
            const pwdInput = document.getElementById('password');
            if (idInput) idInput.value = 'WALI-00892026';
            if (pwdInput) pwdInput.value = 'wali123';
            window.location.href = 'guardian.html';
        }

        // Legacy compatibility alias
        function loginDemo() {
            triggerCurrentDemo();
        }

        // Form submit handler
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
