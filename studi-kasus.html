<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareTech - Studi Kasus Sosial Emosional</title>
    <link rel="icon" href="assets/logo-care-tech.png">
    <link rel="stylesheet" href="dashboard.css">
    
    <style>
        /* ==========================================================================
           STUDI KASUS SPESIAL (AKSES REAL-TIME QR CODE) - CARDBOARD COSMOS
           ========================================================================== */
        
        :root {
            --case-primary: var(--pink);
            --case-accent: var(--sun);
            --case-bg-tag: rgba(255, 46, 147, 0.15);
        }

        /* Top Header Brand (Clean, no question navigation) */
        .case-header-nav {
            max-width: 820px;
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding: 0.8rem 1rem 0;
        }

        .case-brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: var(--ink);
        }

        .case-brand img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(3px 3px 0 var(--ink));
        }

        .case-brand h1 {
            font-size: 1.45rem;
            margin: 0;
            line-height: 1.1;
            letter-spacing: 0.03em;
        }

        .badge-qr-access {
            font-family: var(--mono);
            font-size: 0.82rem;
            font-weight: 800;
            background: #ffffff;
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 0.35rem 0.8rem;
            box-shadow: 2px 2px 0 var(--ink);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Container Layout */
        .case-main-wrapper {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 1rem 4rem;
        }

        /* ==========================================================================
           CARD STUDI KASUS UTAMA
           ========================================================================== */
        .case-card-container {
            position: relative;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 10px 10px 0 var(--ink);
            padding: 2.8rem 2.5rem;
            margin-bottom: 2rem;
            transition: all 0.25s ease;
        }

        @media (max-width: 600px) {
            .case-card-container {
                padding: 1.8rem 1.3rem;
                box-shadow: 6px 6px 0 var(--ink);
                border-width: 3.5px;
            }
            .case-header-nav {
                justify-content: center;
                text-align: center;
            }
        }

        /* Category Header Tape Ribbon */
        .case-top-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 3px dashed rgba(0,0,0,0.15);
            padding-bottom: 1.2rem;
        }

        .case-badges-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge-pill {
            font-family: var(--mono);
            font-weight: 800;
            font-size: 0.85rem;
            padding: 0.35rem 0.85rem;
            border: 2.5px solid var(--ink);
            border-radius: 999px;
            box-shadow: 3px 3px 0 var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .badge-number {
            background: var(--sun);
            color: var(--ink);
            font-family: var(--imp);
            font-size: 1.05rem;
            padding: 0.3rem 0.85rem;
            transform: rotate(-2deg);
        }

        .badge-category {
            background: var(--case-primary);
            color: #000;
        }

        .badge-code {
            background: #ffffff;
            color: var(--ink);
        }

        /* 1. Judul */
        .case-title {
            font-size: clamp(2.3rem, 5.5vw, 3.4rem);
            line-height: 1.15;
            margin: 0.2rem 0 1.6rem;
            color: var(--ink);
            letter-spacing: 0.02em;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.06);
        }

        /* 3. Kotak Studi Kasus */
        .scenario-box {
            position: relative;
            background: #fffdf5;
            border: 3.5px solid var(--ink);
            border-radius: 18px 240px 20px 245px/245px 20px 240px 18px;
            padding: 2.5rem 2.2rem;
            margin-bottom: 1.8rem;
            box-shadow: 6px 6px 0 var(--ink);
        }

        @media (max-width: 600px) {
            .scenario-box {
                padding: 2rem 1.4rem;
            }
        }

        .scenario-box::before {
            content: '📌 STUDI KASUS';
            position: absolute;
            top: -16px;
            left: 20px;
            background: var(--sun);
            font-family: var(--imp);
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            color: var(--ink);
            padding: 0.35rem 1rem;
            border: 2.5px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            transform: rotate(-1.5deg);
        }

        .scenario-text {
            font-family: var(--mk);
            font-size: clamp(1.22rem, 2.8vw, 1.35rem);
            line-height: 1.75;
            color: #1a1a1a;
            margin: 0.5rem 0 0;
            font-weight: 600;
        }

        /* Catatan Diskusi Real Time Bersama Karakter Game */
        .realtime-prompt-strip {
            background: #f0faff;
            border: 3.5px solid var(--ink);
            border-radius: 18px;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            box-shadow: 5px 5px 0 var(--ink);
        }

        @media (max-width: 600px) {
            .realtime-prompt-strip {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.9rem;
                padding: 1.2rem 1.1rem;
            }
        }

        .character-guide-avatar {
            width: 68px;
            height: 68px;
            min-width: 68px;
            background: var(--lime);
            border: 3px solid var(--ink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 3px 3px 0 var(--ink);
        }

        .character-guide-avatar img {
            width: 135%;
            height: 135%;
            object-fit: cover;
            object-position: top 10% center;
            image-rendering: pixelated;
        }

        .realtime-prompt-content {
            flex: 1;
        }

        .character-name-tag {
            font-family: var(--mono);
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            background: var(--sun);
            color: var(--ink);
            padding: 0.2rem 0.65rem;
            border: 2px solid var(--ink);
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 0.4rem;
        }

        .realtime-prompt-text {
            font-family: var(--mk);
            font-size: 1.12rem;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0;
            line-height: 1.5;
        }

        .realtime-prompt-text span {
            color: #0b57d0;
            font-weight: 800;
            text-decoration: underline wavy var(--pink) 2px;
        }

        /* ==========================================================================
           QR HELPER VIEW (IF OPENED WITHOUT URL PARAMETER)
           ========================================================================== */
        .qr-placeholder-card {
            background: var(--paper-warm);
            border: 4px solid var(--ink);
            border-radius: 20px;
            padding: 2.8rem 2rem;
            box-shadow: 8px 8px 0 var(--ink);
            text-align: center;
        }

        .qr-placeholder-card h2 {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            margin: 0.6rem 0 0.5rem;
        }

        .qr-placeholder-card p {
            font-family: var(--mk);
            font-size: 1.15rem;
            color: #444;
            max-width: 600px;
            margin: 0 auto 1.8rem;
            line-height: 1.5;
        }

        .qr-picker-box {
            background: #ffffff;
            border: 2.5px solid var(--ink);
            border-radius: 12px;
            padding: 1.2rem;
            display: inline-block;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .qr-select {
            width: 100%;
            font-family: var(--mk);
            font-size: 1.05rem;
            padding: 0.7rem 0.9rem;
            border: 2px solid var(--ink);
            border-radius: 8px;
            outline: none;
            margin-bottom: 0.8rem;
            box-sizing: border-box;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            font-family: var(--imp);
            font-size: 1rem;
            padding: 0.7rem 1.2rem;
            border: 3px solid var(--ink);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--ink);
            transition: all 0.15s ease;
            user-select: none;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-icon:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .btn-sun {
            background: var(--sun);
            color: var(--ink);
        }

        /* Print Media Styles */
        @media print {
            .case-header-nav,
            .bg-decorations {
                display: none !important;
            }

            body {
                background: #ffffff !important;
                padding: 0 !important;
            }

            .case-card-container {
                border: 2px solid #000 !important;
                box-shadow: none !important;
                padding: 1rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Space & Scrapbook Decorations -->
    <div class="bg-decorations" style="position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;" aria-hidden="true">
        <b class="star" style="top:7%;left:10%"></b>
        <b class="star" style="top:18%;right:12%;color:var(--cy);animation-delay:-0.4s"></b>
        <b class="star" style="top:72%;left:6%;color:var(--pink);animation-delay:-1.1s"></b>
        <b class="star" style="top:85%;right:15%;color:var(--lime);animation-delay:-0.7s"></b>
        <b class="star" style="top:40%;right:5%;color:var(--sun)"></b>
        <i class="deb tp" style="left:4%;top:30%"></i>
        <i class="deb sc" style="right:5%;top:52%;animation-delay:-1.5s"></i>
        <i class="deb cp" style="left:5%;bottom:10%;animation-delay:-0.8s"></i>
    </div>

    <!-- Top Header Brand (Clean, no question navigation) -->
    <header class="case-header-nav">
        <div class="case-brand">
            <img src="assets/logo-care-tech.png" alt="CareTech Logo">
            <div>
                <span class="tape tape-lime" style="font-size: 0.75rem; padding: 0.15rem 0.6rem; margin-bottom: 0.2rem;">HARMONIA // CARETECH</span>
                <h1>Studi Kasus</h1>
            </div>
        </div>

        <div class="badge-qr-access">
            <span>📱</span> Pindai QR Code
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="case-main-wrapper" id="app-root">
        <!-- Rendered Dynamically by JavaScript -->
    </main>

    <!-- Import 50 Case Studies Data -->
    <script src="cases-data.js"></script>

    <!-- Application Script -->
    <script>
        let currentCase = null;

        // Initialize from URL parameter on load
        window.addEventListener('DOMContentLoaded', () => {
            handleRoute();
        });

        // Listen for browser navigation changes
        window.addEventListener('popstate', () => {
            handleRoute();
        });

        /**
         * Resolve case from URL parameter
         */
        function handleRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            
            const idParam = urlParams.get('id') || urlParams.get('no') || urlParams.get('case');
            const catParam = urlParams.get('kategori') || urlParams.get('category') || urlParams.get('pilar');
            const slugParam = urlParams.get('slug') || urlParams.get('topik');
            const codeParam = urlParams.get('code');

            let foundCase = null;

            if (codeParam && window.getCaseStudyByCode) {
                foundCase = getCaseStudyByCode(codeParam);
            } else if (catParam && idParam && window.getCaseStudyByCategoryAndSubId) {
                foundCase = getCaseStudyByCategoryAndSubId(catParam, idParam);
            } else if (idParam && window.getCaseStudyById) {
                foundCase = getCaseStudyById(idParam);
            } else if (slugParam && window.getCaseStudyBySlug) {
                foundCase = getCaseStudyBySlug(slugParam);
            }

            if (foundCase) {
                currentCase = foundCase;
                renderSingleCaseView(foundCase);
            } else if (!idParam && !slugParam && !codeParam) {
                // If opened directly without QR code parameter, show QR code helper
                renderQrGuideView();
            } else {
                renderNotFoundView(idParam || slugParam || codeParam);
            }
        }

        /**
         * Render Single Case Study View:
         * Hanya menampilkan: Judul, Subjudul, dan Studi Kasus
         * (Jawaban dilakukan secara real-time / lisan, tanpa kolom jawaban tertulis)
         */
        function renderSingleCaseView(item) {
            document.title = `${item.title} - Studi Kasus CareTech`;
            
            // Set dynamic theme accent
            document.documentElement.style.setProperty('--case-primary', item.categoryColor || '#ff2e93');
            document.documentElement.style.setProperty('--case-accent', item.categoryAccent || '#ffe500');

            // Pick character game sprite
            const charAvatarMap = {
                'nakula': 'assets/sprites/characters/detailed/nakula/nakula.png',
                'nabula': 'assets/sprites/characters/detailed/nabula/nabula.png',
                'mei': 'assets/sprites/characters/mei.png',
                'bagas': 'assets/sprites/characters/detailed/bagas/bagas.png'
            };
            const avatarSrc = charAvatarMap[item.character] || 'assets/sprites/characters/detailed/nakula/nakula.png';
            const charName = item.characterName || 'Nakula';

            const html = `
                <div class="case-card-container mk">
                    <!-- Top Category & Number Meta Row -->
                    <div class="case-top-meta">
                        <div class="case-badges-group">
                            <span class="badge-pill badge-number">#${String(item.id).padStart(2, '0')}</span>
                            <span class="badge-pill badge-code">${item.categoryCode}</span>
                            <span class="badge-pill badge-category" style="background:${item.categoryColor};">
                                ${item.categoryIndo}
                            </span>
                        </div>
                    </div>

                    <!-- 1. JUDUL -->
                    <h2 class="case-title">${escapeHtml(item.title)}</h2>

                    <!-- 2. STUDI KASUS -->
                    <div class="scenario-box">
                        <p class="scenario-text">${escapeHtml(item.scenario)}</p>
                    </div>

                    <!-- DISKUSI REAL-TIME BERSAMA KARAKTER GAME -->
                    <div class="realtime-prompt-strip">
                        <div class="character-guide-avatar">
                            <img src="${avatarSrc}" alt="${charName}">
                        </div>
                        <div class="realtime-prompt-content">
                            <span class="character-name-tag">Tantangan dari ${charName}:</span>
                            <p class="realtime-prompt-text">
                                "Jika kamu berada di kondisi tersebut, <span>apa yang harus kamu lakukan?</span> Sampaikan tanggapanmu secara langsung sekarang!"
                            </p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app-root').innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /**
         * Render Helper View (Jika halaman dibuka tanpa memindai QR code)
         */
        function renderQrGuideView() {
            document.title = "Studi Kasus - Pindai QR Code";

            const allCases = window.CASE_STUDIES_DATA || [];
            const optionsHtml = allCases.map(c => `
                <option value="${c.id}">Kasus #${c.id}: ${c.title} (${c.categoryIndo})</option>
            `).join('');

            const html = `
                <div class="qr-placeholder-card mk">
                    <span class="tape tape-lime" style="font-size: 0.95rem;">AKSES STUDI KASUS KHUSUS</span>
                    <h2>Silakan Pindai QR Code</h2>
                    <p>
                        Halaman ini dirancang untuk diakses langsung melalui QR code pada kartu studi kasus masing-masing topik.
                    </p>

                    <div class="qr-picker-box mk-alt">
                        <p style="font-family: var(--mono); font-size: 0.85rem; font-weight: bold; margin-bottom: 0.5rem; text-align: left;">
                            Uji Coba / Buka Kasus Spesifik:
                        </p>
                        <select class="qr-select" id="preview-select">
                            ${optionsHtml}
                        </select>
                        <button type="button" class="btn-icon btn-sun" style="width: 100%;" onclick="openSelectedCase()">
                            Buka Kasus Terpilih ➔
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('app-root').innerHTML = html;
        }

        /**
         * Render Not Found View
         */
        function renderNotFoundView(param) {
            document.title = "Kasus Tidak Ditemukan - CareTech";
            const html = `
                <div class="qr-placeholder-card mk" style="background: #fff5f5;">
                    <span class="tape tape-pink" style="font-size: 0.95rem;">KASUS TIDAK DITEMUKAN</span>
                    <h2>QR Code Tidak Valid</h2>
                    <p>
                        Parameter kasus (<strong>${escapeHtml(param || '')}</strong>) tidak ditemukan di database 50 studi kasus.
                    </p>
                    <button type="button" class="btn-icon btn-sun" onclick="window.location.href='studi-kasus.html?id=1'">
                        Buka Contoh Kasus #01 ➔
                    </button>
                </div>
            `;
            document.getElementById('app-root').innerHTML = html;
        }

        /**
         * Switch case from selector (helper preview for testing)
         */
        function openSelectedCase() {
            const selectEl = document.getElementById('preview-select');
            if (selectEl && selectEl.value) {
                window.location.search = `?id=${selectEl.value}`;
            }
        }

        /**
         * Escape HTML
         */
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
